<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RobotaxiStore — ABD robotaksi filolarına yatırım</title>
<meta name="description" content="RobotaxiStore: Türkiye'den ve dünyadan bireysel sermayeyi ABD'deki robotaksi filolarıyla buluşturmayı hedefleyen, planlama aşamasındaki yatırım platformu projesi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-14 -14 128 128'%3E%3Crect x='-14' y='-14' width='128' height='128' rx='28' fill='%230a0c10'/%3E%3Cpath d='M31.7 15.4A39 39 0 1 0 86.8 35.6' fill='none' stroke='%23fff' stroke-width='11' stroke-linecap='round'/%3E%3Cpath d='M48.4 10.6A39 39 0 0 1 77.2 22.2' fill='none' stroke='%23ffb800' stroke-width='11' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23ffb800'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10; --bg2:#10141b; --bg3:#161b24; --line:#222a36; --text:#e9edf3; --muted:#8d97a8;
    --accent:#ffb800; --accent-ink:#0a0c10; --blue:#5aa9ff;
    --display:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,.logo{font-family:var(--display);line-height:1.1;letter-spacing:-.02em;font-weight:700}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;width:100%}
  section{padding:110px 0;border-top:1px solid var(--line)}
  @media(max-width:720px){section{padding:72px 0}}
  .eyebrow{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
  h2{font-size:clamp(28px,4.2vw,44px);max-width:760px}
  .lead{color:var(--muted);font-size:18px;max-width:640px;margin-top:18px}
  .head{margin-bottom:56px}
  .mono{font-family:var(--mono)}

  /* nav */
  nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(10,12,16,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .logo{font-size:21px;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .logo img{height:32px}
  .logo .mark{width:30px;height:30px;color:var(--text)}
  .logo .word{font-size:22px;letter-spacing:-.03em}
  .logo .sub{color:var(--muted);font-weight:500}
  .nav-links{display:flex;gap:26px;font-size:14.5px;color:var(--muted)}
  .nav-links a:hover{color:var(--text)}
  .nav-right{display:flex;align-items:center;gap:14px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .lang button{background:none;border:0;color:var(--muted);padding:5px 11px;border-radius:999px;font:600 12.5px var(--body);cursor:pointer}
  .lang button.on{background:var(--text);color:var(--bg)}
  @media(max-width:960px){.nav-links{display:none}}
  @media(max-width:520px){nav .nav-cta{display:none}}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15.5px;transition:transform .15s,border-color .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--muted)}
  .btn.sm{padding:9px 16px;font-size:14px}

  /* hero */
  .hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 80px;border:0;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 500px at 78% 40%,rgba(255,184,0,.10),transparent 70%)}
  .hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
  @media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
  .hero h1{font-size:clamp(40px,6.2vw,76px);margin-bottom:24px}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero .lead{font-size:19px;margin:0 0 36px}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .status{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--muted);background:var(--bg2)}
  .status .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .map{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:24px;background:var(--bg2);overflow:hidden}
  .map canvas{width:100%;height:100%;display:block}
  .map .cap{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em}
  .map .cap b{color:var(--accent);font-weight:500}

  /* generic cards */
  .grid{display:grid;gap:18px}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:720px){.g2{grid-template-columns:1fr}}
  .g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:30px}
  .card h3{font-size:20px;margin-bottom:10px}
  .card p{color:var(--muted);font-size:15.5px}
  .ico{width:46px;height:46px;border-radius:12px;background:rgba(255,184,0,.1);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* stats */
  .stat{font:700 clamp(38px,5vw,56px)/1 var(--display);color:var(--accent);margin-bottom:14px;letter-spacing:-.02em}
  .source{margin-top:22px;font-size:13px;color:var(--muted);font-style:italic}

  /* bridge */
  .bridge{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:22px}
  .arrow{display:flex;align-items:center;color:var(--accent);font-size:26px}
  @media(max-width:860px){.bridge{grid-template-columns:1fr}.arrow{justify-content:center;transform:rotate(90deg)}}
  .step .n{font:500 14px var(--mono);color:var(--accent);display:block;margin-bottom:14px}

  /* revenue */
  .rev{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
  @media(max-width:860px){.rev{grid-template-columns:1fr}}
  .flow{display:flex;flex-direction:column;gap:10px}
  .fbox{border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-weight:600;background:var(--bg2)}
  .fbox.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .fbox small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
  .fdown{text-align:center;color:var(--muted)}
  .revcard{border:1px solid rgba(255,184,0,.35);background:linear-gradient(160deg,rgba(255,184,0,.08),transparent 60%),var(--bg2);border-radius:22px;padding:36px}
  .revcard .big{font:700 64px/1 var(--display);color:var(--accent);margin-bottom:14px}
  .revcard p{color:var(--text)}
  .revcard .fine{color:var(--muted);font-size:14px;margin-top:16px;font-style:italic}

  /* roadmap */
  .road{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  @media(max-width:900px){.road{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.road{grid-template-columns:1fr}}
  .ph{border-top:2px solid var(--line);padding-top:20px}
  .ph.on{border-color:var(--accent)}
  .ph .tag{font:500 12px var(--mono);color:var(--accent);letter-spacing:.1em}
  .ph .t{font-size:13px;color:var(--muted);margin-bottom:10px}
  .ph h3{font-size:21px;margin-bottom:8px}
  .ph p{color:var(--muted);font-size:15px}

  /* scenarios */
  .card.mid{border-color:var(--accent);background:linear-gradient(160deg,rgba(255,184,0,.08),transparent 60%),var(--bg2)}
  .principles{margin-top:18px;display:flex;gap:16px;align-items:flex-start;border:1px dashed var(--line);border-radius:16px;padding:20px 24px;color:var(--muted);font-size:15px}

  /* founder */
  .founder{display:grid;grid-template-columns:200px 1fr;gap:44px;align-items:center}
  .founder .pic{width:200px;height:200px;border-radius:24px;object-fit:cover;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .founder h3{font-size:30px;margin-bottom:6px}
  .founder .role{color:var(--accent);margin-bottom:14px;font-weight:600}
  .founder p{color:var(--muted);max-width:620px}
  @media(max-width:720px){.founder{grid-template-columns:1fr}}

  /* contact */
  .contact-box{border-radius:28px;padding:56px;background:linear-gradient(135deg,#1a1606,#0f1218 55%);border:1px solid rgba(255,184,0,.3);display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
  @media(max-width:860px){.contact-box{grid-template-columns:1fr;padding:36px 26px}}
  .contact-box h2{font-size:clamp(28px,3.6vw,40px)}
  .mailrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 20px;flex-wrap:wrap}
  .mailrow a{font:500 15px var(--mono);flex:1;min-width:0;overflow-wrap:anywhere}
  .mailrow button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:9px 16px;font:600 14px var(--body);cursor:pointer}
  .disclaimer{color:var(--muted);font-size:13px;margin-top:28px;max-width:820px;line-height:1.7}

  footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>

<!-- ========== NAV ========== -->
<nav>
  <div class="wrap">
    <a href="#top" class="logo">
      <svg class="mark" viewBox="-6 -6 112 112" aria-hidden="true"><path d="M31.7 15.4A39 39 0 1 0 86.8 35.6" fill="none" stroke="currentColor" stroke-width="10.5" stroke-linecap="round"/><path d="M48.4 10.6A39 39 0 0 1 77.2 22.2" fill="none" stroke="var(--accent)" stroke-width="10.5" stroke-linecap="round"/><circle cx="50" cy="50" r="10" fill="var(--accent)"/></svg><span class="word">robotaxi<span class="sub">store</span></span>
    </a>
    <div class="nav-links">
      <a href="#firsat" data-i="nav.opp"></a>
      <a href="#model" data-i="nav.model"></a>
      <a href="#yol" data-i="nav.road"></a>
      <a href="#risk" data-i="nav.risk"></a>
      <a href="#iletisim" data-i="nav.contact"></a>
    </div>
    <div class="nav-right">
      <div class="lang">
        <button data-l="tr" class="on">TR</button><button data-l="en">EN</button><button data-l="de">DE</button>
      </div>
      <a href="#iletisim" class="btn primary sm nav-cta" data-i="nav.cta"></a>
    </div>
  </div>
</nav>

<!-- ========== HERO ========== -->
<header class="hero" id="top">
  <div class="wrap">
    <div>
      <p class="eyebrow" data-i="hero.eye"></p>
      <h1 data-i="hero.h1"></h1>
      <p class="lead" data-i="hero.sub"></p>
      <div class="btns">
        <a href="#model" class="btn primary" data-i="hero.c1"></a>
        <a href="#iletisim" class="btn ghost" data-i="hero.c2"></a>
      </div>
      <p class="status"><span class="pulse"></span><span data-i="hero.status"></span></p>
    </div>
    <div class="map">
      <canvas id="fleet"></canvas>
      <div class="cap"><span data-i="hero.cap1"></span><b data-i="hero.cap2"></b></div>
    </div>
  </div>
</header>

<!-- ========== FIRSAT ========== -->
<section id="firsat">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="opp.eye"></p>
      <h2 class="reveal" data-i="opp.h2"></h2>
      <p class="lead reveal" data-i="opp.lead"></p>
    </div>
    <div class="grid g3">
      <div class="card reveal"><div class="stat">$45.7B</div><p data-i="opp.s1"></p></div>
      <div class="card reveal"><div class="stat">~$415B</div><p data-i="opp.s2"></p></div>
      <div class="card reveal"><div class="stat">500,000+</div><p data-i="opp.s3"></p></div>
    </div>
    <p class="source reveal" data-i="opp.src"></p>
  </div>
</section>

<!-- ========== MODEL ========== -->
<section id="model">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="model.eye"></p>
      <h2 class="reveal" data-i="model.h2"></h2>
    </div>
    <div class="bridge">
      <div class="card reveal">
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 4.3 5.7 4.3 9s-1.5 6.4-4.3 9c-2.8-2.6-4.3-5.7-4.3-9S9.2 5.6 12 3z"/></svg></div>
        <h3 data-i="model.b1h"></h3><p data-i="model.b1d"></p>
      </div>
      <div class="arrow">→</div>
      <div class="card reveal">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l9 4.5-9 4.5-9-4.5L12 3z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5L12 21l9-4.5"/></svg></div>
        <h3 data-i="model.b2h"></h3><p data-i="model.b2d"></p>
      </div>
      <div class="arrow">→</div>
      <div class="card reveal">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/><path d="M6 11h12"/></svg></div>
        <h3 data-i="model.b3h"></h3><p data-i="model.b3d"></p>
      </div>
    </div>
    <div class="grid g4">
      <div class="card step reveal"><span class="n">01</span><h3 data-i="model.s1h"></h3><p data-i="model.s1d"></p></div>
      <div class="card step reveal"><span class="n">02</span><h3 data-i="model.s2h"></h3><p data-i="model.s2d"></p></div>
      <div class="card step reveal"><span class="n">03</span><h3 data-i="model.s3h"></h3><p data-i="model.s3d"></p></div>
      <div class="card step reveal"><span class="n">04</span><h3 data-i="model.s4h"></h3><p data-i="model.s4d"></p></div>
    </div>
  </div>
</section>

<!-- ========== GELİR ========== -->
<section id="gelir">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="rev.eye"></p>
      <h2 class="reveal" data-i="rev.h2"></h2>
    </div>
    <div class="rev">
      <div class="flow reveal">
        <div class="fbox" data-i="rev.f1"></div>
        <div class="fdown">↓</div>
        <div class="fbox"><span data-i="rev.f2"></span><small data-i="rev.f2s"></small></div>
        <div class="fdown">↓</div>
        <div class="fbox hl" data-i="rev.f3"></div>
      </div>
      <div class="revcard reveal">
        <div class="big">25–30%</div>
        <p data-i="rev.note"></p>
        <p class="fine" data-i="rev.fine"></p>
      </div>
    </div>
  </div>
</section>

<!-- ========== YOL HARİTASI ========== -->
<section id="yol">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="road.eye"></p>
      <h2 class="reveal" data-i="road.h2"></h2>
    </div>
    <div class="road">
      <div class="ph on reveal"><div class="tag" data-i="road.p1"></div><div class="t" data-i="road.t1"></div><h3 data-i="road.h1"></h3><p data-i="road.d1"></p></div>
      <div class="ph reveal"><div class="tag" data-i="road.p2"></div><div class="t" data-i="road.t2"></div><h3 data-i="road.h2b"></h3><p data-i="road.d2"></p></div>
      <div class="ph reveal"><div class="tag" data-i="road.p3"></div><div class="t" data-i="road.t3"></div><h3 data-i="road.h3"></h3><p data-i="road.d3"></p></div>
      <div class="ph reveal"><div class="tag" data-i="road.p4"></div><div class="t" data-i="road.t4"></div><h3 data-i="road.h4"></h3><p data-i="road.d4"></p></div>
    </div>
  </div>
</section>

<!-- ========== RİSK ========== -->
<section id="risk">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="risk.eye"></p>
      <h2 class="reveal" data-i="risk.h2"></h2>
      <p class="lead reveal" data-i="risk.lead"></p>
    </div>
    <div class="grid g2">
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 21h8"/><path d="M5 7h14"/><path d="M3 7l2.5 5.5L8 7M16 7l2.5 5.5L21 7"/></svg></div><h3 data-i="risk.r1h"></h3><p data-i="risk.r1d"></p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 15.5h7"/></svg></div><h3 data-i="risk.r2h"></h3><p data-i="risk.r2d"></p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4.5"/></svg></div><h3 data-i="risk.r3h"></h3><p data-i="risk.r3d"></p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div><h3 data-i="risk.r4h"></h3><p data-i="risk.r4d"></p></div>
    </div>
  </div>
</section>

<!-- ========== FİNANSAL YAKLAŞIM ========== -->
<section id="finans">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="fin.eye"></p>
      <h2 class="reveal" data-i="fin.h2"></h2>
    </div>
    <div class="grid g3">
      <div class="card reveal"><h3 data-i="fin.c1h"></h3><p data-i="fin.c1d"></p></div>
      <div class="card mid reveal"><h3 data-i="fin.c2h"></h3><p data-i="fin.c2d"></p></div>
      <div class="card reveal"><h3 data-i="fin.c3h"></h3><p data-i="fin.c3d"></p></div>
    </div>
    <div class="principles reveal"><span style="color:var(--accent)">●</span><span data-i="fin.pr"></span></div>
  </div>
</section>

<!-- ========== İŞ BİRLİĞİ ========== -->
<section id="isbirligi">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="par.eye"></p>
      <h2 class="reveal" data-i="par.h2"></h2>
    </div>
    <div class="grid g3">
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></div><h3 data-i="par.p1h"></h3><p data-i="par.p1d"></p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg></div><h3 data-i="par.p2h"></h3><p data-i="par.p2d"></p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M13 6l1.6-1.6a4 4 0 015.7 5.7L18.7 11.7"/><path d="M11 18l-1.6 1.6a4 4 0 01-5.7-5.7L5.3 12.3"/></svg></div><h3 data-i="par.p3h"></h3><p data-i="par.p3d"></p></div>
    </div>
  </div>
</section>

<!-- ========== KURUCU ========== -->
<section id="kurucu">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow reveal" data-i="fo.eye"></p>

/* hero: animated fleet illustration on a city grid */
(function(){
  const c = document.getElementById("fleet"), x = c.getContext("2d");
  let W,H,S, cars=[];
  const N=12;
  function size(){
    const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1;
    W=r.width; H=r.height; c.width=W*d; c.height=H*d; x.setTransform(d,0,0,d,0,0); S=W/N;
    cars = Array.from({length:9},(_,i)=>newCar(i===0));
  }
  function newCar(hl){
    const horiz=Math.random()<.5, line=1+Math.floor(Math.random()*(N-1));
    return {horiz, line, p:Math.random()*W, v:(.35+Math.random()*.55)*(Math.random()<.5?-1:1), hl};
  }
  function draw(){
    x.clearRect(0,0,W,H);
    x.strokeStyle="rgba(255,255,255,.06)"; x.lineWidth=1;
    for(let i=1;i<N;i++){ x.beginPath(); x.moveTo(i*S,0); x.lineTo(i*S,H); x.moveTo(0,i*S); x.lineTo(W,i*S); x.stroke(); }
    x.strokeStyle="rgba(255,255,255,.14)"; x.lineWidth=2;
    [3,8].forEach(i=>{ x.beginPath(); x.moveTo(i*S,0); x.lineTo(i*S,H); x.moveTo(0,i*S); x.lineTo(W,i*S); x.stroke(); });
    cars.forEach(k=>{
      k.p+=k.v; if(k.p<-10||k.p>W+10){ Object.assign(k,newCar(k.hl)); k.p=k.v>0?-8:W+8; }
      const px=k.horiz?k.p:k.line*S, py=k.horiz?k.line*S:k.p;
      const col=k.hl?"255,184,0":"90,169,255";
      const g=x.createRadialGradient(px,py,0,px,py,16); g.addColorStop(0,`rgba(${col},.45)`); g.addColorStop(1,`rgba(${col},0)`);
      x.fillStyle=g; x.beginPath(); x.arc(px,py,16,0,7); x.fill();
      x.fillStyle=`rgb(${col})`; x.beginPath(); x.arc(px,py,k.hl?4.5:3.2,0,7); x.fill();
    });
    requestAnimationFrame(draw);
  }
  size(); addEventListener("resize",size);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ cars.forEach(k=>k.v=0); }
  draw();
})();
</script>
